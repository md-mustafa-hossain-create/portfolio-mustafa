<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal background shell -->
  <polygon points="256,32 450,144 450,368 256,480 62,368 62,144" fill="#09090b" stroke="url(#brand-grad)" stroke-width="20" stroke-linejoin="round" />

  <!-- Inner Chevron Left (<) -->
  <path d="M 210,180 L 130,256 L 210,332" stroke="url(#glow-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Inner Chevron Right (>) -->
  <path d="M 302,180 L 382,256 L 302,332" stroke="url(#glow-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Center Slash (/) -->
  <line x1="280" y1="160" x2="232" y2="352" stroke="#ffffff" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
</svg>