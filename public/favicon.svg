<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Bezel / Shell -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#000000" stroke="#10b981" stroke-width="24"/>
  <!-- Decorative Grid line to fit the terminal look -->
  <line x1="16" y1="128" x2="496" y2="128" stroke="#10b981" stroke-dasharray="8 8" stroke-width="4" opacity="0.25" />
  <!-- Terminal Prompt Sign: > -->
  <path d="M120 160 L240 256 L120 352" stroke="#10b981" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Terminal Cursor: _ -->
  <line x1="280" y1="352" x2="390" y2="352" stroke="#34d399" stroke-width="48" stroke-linecap="round" />
</svg>